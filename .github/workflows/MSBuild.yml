name: MSBuild

on:
  push:
    branches: [ main, stable/* ]
    paths-ignore:
      - 'badges/**'
      - 'CoverageReport/SummaryGithub.md'
  pull_request:
    branches: [ main, stable/* ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  SOLUTION_FILE_PATH: build/src/AnkhSvn.sln

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        path: build

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Add Subversion to PATH
      uses: ampscm/setup-subversion@v1


    - name: Setup NuGet
      uses: NuGet/setup-nuget@v4.0

    - name: Setup version
      working-directory: build
      run: cmd.exe /C scripts\gh-version-setup ${{ github.run_number }}

    - name: Build 2022
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: >
        msbuild /m /v:m /restore /t:rebuild
        /p:UseVsSdkVersion=17.0
        /p:Configuration=Release
        ${{ env.SOLUTION_FILE_PATH }}
        @build\scripts\msbuild-version.rsp

    - name: Run Ankh.Tests with coverage
      id: ankh_tests
      continue-on-error: true
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: >
        dotnet test build/src/Ankh.Tests/Ankh.Tests.csproj
        --configuration Release
        --no-build
        --no-restore
        --collect:"XPlat Code Coverage"
        --results-directory "${{ github.workspace }}\TestResults\Ankh.Tests"
        --logger "trx;LogFileName=Ankh.Tests.trx"
        --logger "console;verbosity=normal"
        -- RunConfiguration.TargetPlatform=x64 RunConfiguration.TreatNoTestsAsError=true

    - name: Run Ankh.VS.UnitTest with coverage
      id: ankh_vs_tests
      continue-on-error: true
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: >
        dotnet test build/src/Ankh.VS.UnitTest/Ankh.VS.UnitTest.csproj
        --configuration Release
        --no-build
        --no-restore
        --collect:"XPlat Code Coverage"
        --results-directory "${{ github.workspace }}\TestResults\Ankh.VS.UnitTest"
        --logger "trx;LogFileName=Ankh.VS.UnitTest.trx"
        --logger "console;verbosity=normal"
        -- RunConfiguration.TargetPlatform=x64 RunConfiguration.TreatNoTestsAsError=true

    - name: Install ReportGenerator
      if: always()
      shell: pwsh
      run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11

    - name: Generate coverage report
      if: always()
      shell: pwsh
      run: |
        $coverageFiles = Get-ChildItem "${{ github.workspace }}\TestResults" -Recurse -Filter "coverage.cobertura.xml" -ErrorAction SilentlyContinue
        if (-not $coverageFiles) {
          throw "No Coverlet coverage.cobertura.xml files were produced."
        }

        $reports = ($coverageFiles.FullName -join ";")
        Write-Host "Merging coverage reports:"
        $coverageFiles | ForEach-Object { Write-Host "  $($_.FullName)" }

        reportgenerator "-reports:$reports" "-targetdir:${{ github.workspace }}\CoverageReport" "-reporttypes:Html;Cobertura;MarkdownSummaryGithub"

        $summary = "${{ github.workspace }}\CoverageReport\SummaryGithub.md"
        if (Test-Path $summary) {
          Write-Host "Coverage summary:"
          Get-Content $summary | ForEach-Object {
            Write-Host $_
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $_
          }
        }

    - name: Generate README badges
      id: readme_badges
      if: always()
      shell: pwsh
      run: |
        $badgeDir = "${{ github.workspace }}\ReadmeBadges"
        $coveragePath = "${{ github.workspace }}\CoverageReport\Cobertura.xml"
        $trxFiles = Get-ChildItem "${{ github.workspace }}\TestResults" -Recurse -Filter "*.trx" -ErrorAction SilentlyContinue

        New-Item -ItemType Directory -Force -Path $badgeDir | Out-Null

        if (-not (Test-Path $coveragePath) -or -not $trxFiles) {
          Write-Host "Coverage or TRX results are unavailable; leaving the published badges unchanged."
          "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0
        }

        $total = 0
        $passed = 0
        $failed = 0
        $skipped = 0

        foreach ($trxFile in $trxFiles) {
          [xml]$trx = Get-Content -Raw $trxFile.FullName
          $counters = $trx.SelectSingleNode("/*[local-name()='TestRun']/*[local-name()='ResultSummary']/*[local-name()='Counters']")
          if ($null -eq $counters) {
            continue
          }

          $total += [int]$counters.GetAttribute("total")
          $passed += [int]$counters.GetAttribute("passed")
          $failed += [int]$counters.GetAttribute("failed")

          $notExecuted = $counters.GetAttribute("notExecuted")
          if ($notExecuted) {
            $skipped += [int]$notExecuted
          }
        }

        [xml]$coverage = Get-Content -Raw $coveragePath
        $coverageRoot = $coverage.SelectSingleNode("/*[local-name()='coverage']")
        if ($null -eq $coverageRoot) {
          throw "Cobertura report does not contain a coverage root element."
        }

        $lineRate = [double]::Parse(
          $coverageRoot.GetAttribute("line-rate"),
          [Globalization.CultureInfo]::InvariantCulture)
        $branchRate = [double]::Parse(
          $coverageRoot.GetAttribute("branch-rate"),
          [Globalization.CultureInfo]::InvariantCulture)

        $linePercent = [Math]::Round($lineRate * 100, 1)
        $branchPercent = [Math]::Round($branchRate * 100, 1)

        function Get-CoverageColor([double]$percent) {
          if ($percent -ge 80) { return "#4c1" }
          if ($percent -ge 60) { return "#97ca00" }
          if ($percent -ge 40) { return "#dfb317" }
          if ($percent -ge 20) { return "#fe7d37" }
          return "#e05d44"
        }

        function Write-Badge(
          [string]$path,
          [string]$label,
          [string]$message,
          [string]$color) {

          $safeLabel = [Security.SecurityElement]::Escape($label)
          $safeMessage = [Security.SecurityElement]::Escape($message)
          $labelWidth = [Math]::Max(60, ($label.Length * 7) + 14)
          $valueWidth = [Math]::Max(55, ($message.Length * 7) + 14)
          $width = $labelWidth + $valueWidth
          $labelX = [Math]::Round($labelWidth / 2)
          $valueX = $labelWidth + [Math]::Round($valueWidth / 2)

          $svg = @"
        <svg xmlns="http://www.w3.org/2000/svg" width="$width" height="20" role="img" aria-label="$($safeLabel): $safeMessage">
          <title>$($safeLabel): $safeMessage</title>
          <mask id="round"><rect width="$width" height="20" rx="3" fill="#fff"/></mask>
          <g mask="url(#round)">
            <rect width="$labelWidth" height="20" fill="#555"/>
            <rect x="$labelWidth" width="$valueWidth" height="20" fill="$color"/>
          </g>
          <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
            <text x="$labelX" y="14">$safeLabel</text>
            <text x="$valueX" y="14">$safeMessage</text>
          </g>
        </svg>
        "@

          Set-Content -Path $path -Value $svg -Encoding utf8
        }

        if ($failed -gt 0) {
          $testMessage = "$passed passed, $failed failed"
          $testColor = "#e05d44"
        }
        elseif ($skipped -gt 0) {
          $testMessage = "$passed passed, $skipped skipped"
          $testColor = "#4c1"
        }
        else {
          $testMessage = "$passed passing"
          $testColor = "#4c1"
        }

        $lineMessage = $linePercent.ToString("0.0", [Globalization.CultureInfo]::InvariantCulture) + "%"
        $branchMessage = $branchPercent.ToString("0.0", [Globalization.CultureInfo]::InvariantCulture) + "%"

        Write-Badge (Join-Path $badgeDir "tests.svg") "tests" $testMessage $testColor
        Write-Badge (Join-Path $badgeDir "coverage.svg") "line coverage" $lineMessage (Get-CoverageColor $linePercent)
        Write-Badge (Join-Path $badgeDir "branches.svg") "branch coverage" $branchMessage (Get-CoverageColor $branchPercent)

        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### README badge values"
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Tests: $passed passed / $total total"
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Line coverage: $lineMessage"
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Branch coverage: $branchMessage"

        "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Publish README badges
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.readme_badges.outputs.ready == 'true'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $remote = "https://x-access-token:$env:GITHUB_TOKEN@github.com/${{ github.repository }}.git"
        $currentMain = (git ls-remote $remote refs/heads/main) -split "\s+" | Select-Object -First 1

        if ($currentMain -ne "${{ github.sha }}") {
          Write-Host "A newer main commit exists; skipping stale badge publication."
          exit 0
        }

        $publishDir = Join-Path $env:RUNNER_TEMP "ankhsvn-readme-badges"
        if (Test-Path $publishDir) {
          Remove-Item -Recurse -Force $publishDir
        }

        git clone --quiet --branch main --single-branch $remote $publishDir
        Set-Location $publishDir

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        New-Item -ItemType Directory -Force -Path "badges" | Out-Null
        Copy-Item "${{ github.workspace }}\ReadmeBadges\*.svg" "badges\" -Force

        New-Item -ItemType Directory -Force -Path "CoverageReport" | Out-Null
        Copy-Item "${{ github.workspace }}\CoverageReport\SummaryGithub.md" "CoverageReport\SummaryGithub.md" -Force

        git add badges/*.svg CoverageReport/SummaryGithub.md
        git diff --cached --quiet
        if ($LASTEXITCODE -eq 0) {
          Write-Host "README badges and coverage summary are already current."
          exit 0
        }

        git commit -m "Update README metrics for run #${{ github.run_number }}"
        git push origin HEAD:main

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: AnkhSVN-Coverage-${{ github.run_number }}
        path: |
          TestResults
          CoverageReport
        if-no-files-found: error

    - name: Verify VSIX Annotate MEF packaging (#7/#47)
      shell: pwsh
      run: |
        # Regression guard for:
        # https://github.com/AmpScm/AnkhSVN/issues/7
        # https://github.com/AmpScm/AnkhSVN/issues/47
        #
        # The fixed Annotate viewer depends on Ankh.UI.dll being shipped as a
        # Microsoft.VisualStudio.MefComponent. Merely packaging the DLL is not enough:
        # without the MEF asset declaration Visual Studio will not discover the WPF margin.
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $vsix = "${{ github.workspace }}\build\src\Ankh.Package\bin\release\Ankh.Package.vsix"
        $archive = [System.IO.Compression.ZipFile]::OpenRead($vsix)
        try {
          $uiAssembly = $archive.Entries | Where-Object { $_.FullName -match '(^|/)Ankh\.UI\.dll$' } | Select-Object -First 1
          if (-not $uiAssembly) {
            throw "Issues #7/#47 regression: Ankh.UI.dll was not included in the generated VSIX"
          }

          $manifestEntry = $archive.Entries | Where-Object { $_.FullName -match '\.vsixmanifest$' } | Select-Object -First 1
          if (-not $manifestEntry) {
            throw "Issues #7/#47 regression: generated VSIX does not contain a VSIX manifest"
          }

          $stream = $manifestEntry.Open()
          $reader = New-Object System.IO.StreamReader($stream)
          try {
            [xml]$manifest = $reader.ReadToEnd()
          }
          finally {
            $reader.Dispose()
            $stream.Dispose()
          }

          $namespaces = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
          $namespaces.AddNamespace("v", "http://schemas.microsoft.com/developer/vsx-schema/2011")
          $namespaces.AddNamespace("d", "http://schemas.microsoft.com/developer/vsx-schema-design/2011")

          # d:ProjectName is design-time metadata and may be stripped from the
          # generated VSIX manifest. Validate the runtime MEF asset Visual Studio
          # actually consumes, while still accepting the source-manifest form.
          $mefAssets = $manifest.SelectNodes(
            "//v:Asset[@Type='Microsoft.VisualStudio.MefComponent']",
            $namespaces)

          $mefAsset = $mefAssets | Where-Object {
            $assetPath = $_.GetAttribute("Path")
            $projectName = $_.GetAttribute(
              "ProjectName",
              "http://schemas.microsoft.com/developer/vsx-schema-design/2011")

            $leafName = [System.IO.Path]::GetFileName($assetPath)
            ($leafName -eq "Ankh.UI.dll") -or
              ($assetPath -eq "|Ankh.UI|") -or
              ($projectName -eq "Ankh.UI")
          } | Select-Object -First 1

          if (-not $mefAsset) {
            $assetPaths = ($mefAssets | ForEach-Object { $_.GetAttribute("Path") }) -join ", "
            throw "Issues #7/#47 regression: generated VSIX does not declare Ankh.UI as a Microsoft.VisualStudio.MefComponent. MEF paths: $assetPaths"
          }

          Write-Host "Verified VSIX contains $($uiAssembly.FullName)"
          Write-Host "Verified Ankh.UI MEF asset path: $($mefAsset.GetAttribute('Path'))"
        }
        finally {
          $archive.Dispose()
        }

    - name: Upload VSIX Artifact
      uses: actions/upload-artifact@v6
      with:
        name: Ankh-VSIX-2022-${{ github.run_number }}
        path: build/src/Ankh.Package/bin/release/Ankh.Package.vsix

    - name: Verify test suites
      if: always()
      shell: pwsh
      run: |
        $failures = @()

        if ("${{ steps.ankh_tests.outcome }}" -ne "success") {
          $failures += "Ankh.Tests"
        }

        if ("${{ steps.ankh_vs_tests.outcome }}" -ne "success") {
          $failures += "Ankh.VS.UnitTest"
        }

        if ($failures.Count -gt 0) {
          throw ("Test suite failure(s): " + ($failures -join ", "))
        }

        Write-Host "Both test suites passed."

    - name: Prepare Release Files
      if: github.event_name != 'pull_request'
      shell: pwsh
      run: |
        $version = "2.9.${{ github.run_number }}"
        $releaseDir = "${{ github.workspace }}\release"
        $coverageZip = Join-Path $releaseDir "AnkhSVN-$version-Coverage.zip"

        New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
        Copy-Item "${{ github.workspace }}\build\src\Ankh.Package\bin\release\Ankh.Package.vsix" "$releaseDir\AnkhSVN-$version-VS2022.vsix"

        Compress-Archive `
          -Path "${{ github.workspace }}\CoverageReport", "${{ github.workspace }}\TestResults" `
          -DestinationPath $coverageZip `
          -Force

        Write-Host "Prepared AnkhSVN-$version-VS2022.vsix"
        Write-Host "Prepared AnkhSVN-$version-Coverage.zip"

    - name: Create GitHub Package
      if: github.event_name != 'pull_request'
      shell: pwsh
      run: |
        $version = "2.9.${{ github.run_number }}"
        Write-Host "Creating AnkhSVN package version $version"
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\package\out" | Out-Null
        Copy-Item "${{ github.workspace }}\build\src\Ankh.Package\bin\release\Ankh.Package.vsix" "${{ github.workspace }}\package\AnkhSVN-$version-VS2022.vsix"
        Copy-Item "${{ github.workspace }}\build\README.md" "${{ github.workspace }}\package\README.md"
        @"
        <?xml version="1.0"?>
        <package>
          <metadata>
            <id>AnkhSVN.VSIX.2022</id>
            <version>$version</version>
            <title>AnkhSVN for Visual Studio 2022</title>
            <authors>AnkhSVN Project</authors>
            <owners>AmpScm</owners>
            <requireLicenseAcceptance>false</requireLicenseAcceptance>
            <license type="expression">Apache-2.0</license>
            <readme>README.md</readme>
            <projectUrl>https://github.com/${{ github.repository }}</projectUrl>
            <description>
              AnkhSVN Subversion integration for Visual Studio 2022.
              This package contains the AnkhSVN Visual Studio VSIX installer.
            </description>
            <repository type="git" url="https://github.com/${{ github.repository }}" commit="${{ github.sha }}" />
            <tags>AnkhSVN SVN Subversion VisualStudio VSIX</tags>
          </metadata>
          <files>
            <file src="AnkhSVN-$version-VS2022.vsix" target="tools\AnkhSVN-$version-VS2022.vsix" />
            <file src="README.md" target="README.md" />
          </files>
        </package>
        "@ | Set-Content -Encoding UTF8 "${{ github.workspace }}\package\AnkhSVN.VSIX.2022.nuspec"
        nuget pack "${{ github.workspace }}\package\AnkhSVN.VSIX.2022.nuspec" -BasePath "${{ github.workspace }}\package" -OutputDirectory "${{ github.workspace }}\package\out"

    - name: Publish GitHub Package
      if: github.event_name != 'pull_request'
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $package = Get-ChildItem "${{ github.workspace }}\package\out\*.nupkg" | Select-Object -First 1
        Write-Host "Publishing $($package.Name)"
        dotnet nuget push "$($package.FullName)" --api-key "$env:GITHUB_TOKEN" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate

    - name: Create GitHub Release
      if: github.event_name != 'pull_request'
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $version = "2.9.${{ github.run_number }}"
        $tag = "v$version"
        $vsix = "${{ github.workspace }}\release\AnkhSVN-$version-VS2022.vsix"
        $coverageZip = "${{ github.workspace }}\release\AnkhSVN-$version-Coverage.zip"
        $nupkg = Get-ChildItem "${{ github.workspace }}\package\out\*.nupkg" | Select-Object -First 1
        Write-Host "Creating release $tag"
        gh release create "$tag" "$vsix" "$($nupkg.FullName)" "$coverageZip" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "AnkhSVN $version" --generate-notes
